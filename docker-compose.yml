name: careeros

services:
  mongodb:
    image: mongo:7.0
    ports:
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand({ ping: 1 }).ok ? 0 : 1)"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  api:
    build: .
    init: true
    command: npm run dev --workspace @careeros/platform
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 3000
      AUTH_SECRET: ${AUTH_SECRET:?Run npm run setup first}
      AUTH_ALLOWED_ORIGINS: ${AUTH_ALLOWED_ORIGINS:-}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      OAUTH_PUBLIC_ORIGIN: ${OAUTH_PUBLIC_ORIGIN:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      WEB_PORT: ${WEB_PORT:-5173}
      INTELLIGENCE_SERVICE_URL: http://intelligence:8000
      INTELLIGENCE_SERVICE_TOKEN: ${INTELLIGENCE_SERVICE_TOKEN:-}
      RESUME_STORAGE_DIR: /data/resumes
      MONGODB_URI: mongodb://mongodb:27017/careeros
    ports:
      - "127.0.0.1:${API_PORT:-3000}:3000"
    volumes:
      - ./backend/platform/src:/app/backend/platform/src
      - resume_data:/data/resumes
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/v1/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  intelligence-db:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: careeros_intelligence
      POSTGRES_USER: intelligence
      POSTGRES_PASSWORD: ${INTELLIGENCE_DB_PASSWORD:?Run npm run setup first}
    volumes:
      - intelligence_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intelligence -d careeros_intelligence"]
      interval: 5s
      timeout: 5s
      retries: 12

  intelligence:
    build:
      context: ./backend/intelligence
      target: runtime
    init: true
    mem_limit: 512m
    pids_limit: 32
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      INTELLIGENCE_SERVICE_TOKEN: ${INTELLIGENCE_SERVICE_TOKEN:-}
      INTELLIGENCE_DATABASE_URL: postgresql://intelligence:${INTELLIGENCE_DB_PASSWORD}@intelligence-db:5432/careeros_intelligence
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-6-luna}
      LLM_REASONING_EFFORT: ${LLM_REASONING_EFFORT:-medium}
    depends_on:
      intelligence-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/internal/v1/health', timeout=2)"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  intelligence-tests:
    profiles: ["test"]
    build:
      context: ./backend/intelligence
      target: test
    init: true
    read_only: true
    mem_limit: 512m
    pids_limit: 32
    tmpfs:
      - /tmp:size=64m
    environment:
      TEST_DATABASE_URL: postgresql://intelligence:${INTELLIGENCE_DB_PASSWORD}@intelligence-db:5432/careeros_intelligence
    depends_on:
      intelligence-db:
        condition: service_healthy

  web:
    build: .
    init: true
    command: npm run dev --workspace @careeros/web
    environment:
      WEB_HOST: 0.0.0.0
      WEB_PORT: 5173
      API_PROXY_TARGET: http://api:3000
    ports:
      - "127.0.0.1:${WEB_PORT:-5173}:5173"
    volumes:
      - ./frontend/web/src:/app/frontend/web/src
      - ./frontend/web/index.html:/app/frontend/web/index.html
    depends_on:
      api:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  mongodb_data:
  resume_data:
  intelligence_db_data:
